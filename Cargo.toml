[package]
name = "mpei-dbms"
version = "1.0.0"
edition = "2021"
authors = ["Грудинин Е.К.", "Степанищев В.Р.", "Криштул А.Н."]
description = "АРМ сопровождения конкурсов на соискание грантов (Вариант № 7) на Rust"

[dependencies]
rusqlite = { version = "0.43", features = ["bundled", "backup"] }
rust_xlsxwriter = "0.102"
clap = { version = "4.6", features = ["derive"] }
comfy-table = "8.0"
csv = "1.3"
eframe = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

[[bin]]
name = "mpei-dbms"
path = "src/main.rs"
